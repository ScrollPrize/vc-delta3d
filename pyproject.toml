[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "vc-delta3d"
version = "0.1.0"
description = "Fast compression for three-dimensional uint8 and uint16 scalar fields"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "numcodecs>=0.15.1",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "ScrollPrize contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
examples = [
    "s3fs>=2024.12.0",
    "zarr>=3.2,<4",
]

[project.urls]
Homepage = "https://github.com/ScrollPrize/vc-delta3d"
Repository = "https://github.com/ScrollPrize/vc-delta3d"
Issues = "https://github.com/ScrollPrize/vc-delta3d/issues"

[project.entry-points."numcodecs.codecs"]
vc-delta3d = "vc_delta3d.numcodecs:Delta3D"

[tool.scikit-build]
cmake.version = ">=3.22"
wheel.packages = ["python/vc_delta3d"]

[tool.scikit-build.cmake.define]
VC_DELTA3D_BUILD_PYTHON = "ON"
VC_DELTA3D_BUILD_TESTS = "OFF"
VC_DELTA3D_INSTALL_CPP = "OFF"

[tool.cibuildwheel]
build = "cp{312,313,314}-*"
skip = "*-musllinux_*"
test-requires = ["pytest"]
test-command = "pytest -q {project}/tests/test_python.py"
audit-requires = ["twine"]
audit-command = "twine check {wheel}"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
