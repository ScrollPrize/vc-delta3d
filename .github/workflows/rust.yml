name: Rust

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test crate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The runner images ship stable Rust and, on Windows, clang-cl.
      - name: Test
        run: cargo test

      - name: Check the packaged crate builds
        run: cargo package
