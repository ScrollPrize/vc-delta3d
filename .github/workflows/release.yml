name: Build and publish Python distributions

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build ${{ matrix.platform }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            arch: x86_64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - platform: macos-arm64
            os: macos-15
            arch: arm64
          - platform: windows-amd64
            os: windows-2025
            arch: AMD64

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Zstd development library (macOS)
        if: runner.os == 'macOS'
        run: |
          # Homebrew bottles target the runner OS, not our macOS 11 wheel floor.
          curl -fsSL https://github.com/meta/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz -o "$RUNNER_TEMP/zstd-1.5.7.tar.gz"
          echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  $RUNNER_TEMP/zstd-1.5.7.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/zstd-1.5.7.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/zstd-1.5.7/build/cmake" -B "$RUNNER_TEMP/zstd-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/zstd-install" \
            -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_TESTS=OFF -DZSTD_BUILD_SHARED=OFF
          cmake --build "$RUNNER_TEMP/zstd-build" --parallel 3
          cmake --install "$RUNNER_TEMP/zstd-build"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/zstd-install" >> "$GITHUB_ENV"

      - name: Install Zstd development library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zstd:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_PREFIX_PATH=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # NG's C kernels use C99 variable-length arrays; MSVC C does not support them.
          "CMAKE_GENERATOR_TOOLSET=ClangCL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
        with:
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build and check source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs:
      - build-wheels
      - build-sdist
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/vc-delta3d
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
