name: WebAssembly

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test with Emscripten
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.10

      # emcmake sets Node as the emulator, so ctest runs the tests under Node.
      # The SIMD128 kernels are on by default under Emscripten.
      - name: Configure
        run: >
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release
          -DVC_DELTA3D_BUILD_TESTS=ON -DVC_DELTA3D_MODERN_SMOKE=ON

      - name: Build
        run: cmake --build build-wasm -j

      - name: Test
        run: |
          ctest --test-dir build-wasm --output-on-failure
          node build-wasm/vc_delta3d_modern_smoke.js
